name: Android Build

on:
  push:
    branches:
      - main
      - Antigravity
    paths:
      - "mobile-app/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "mobile-app/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Test, Lint & Assemble APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Copy debug APK with release filename
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Omni-mobile-1.0.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omni-mobile-1.0-debug-apk
          path: mobile-app/dist/Omni-mobile-1.0.apk
          if-no-files-found: error

      - name: Assemble signed release APK (when signing secrets are configured)
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          HAS_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          OMNI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          OMNI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          OMNI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${RUNNER_TEMP}/omni-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          OMNI_KEYSTORE_PATH="$KEYSTORE_FILE" ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk dist/Omni-mobile-1.0-release.apk

      - name: Upload signed release APK artifact
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          HAS_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Omni-mobile-1.0-release-apk
          path: mobile-app/dist/Omni-mobile-1.0-release.apk
          if-no-files-found: warn
