[package]
name = "omni-mobile"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Omni Chat for Android and iOS"

[dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks", "launch", "document"] }
futures-util = "0.3"
omni-core = { path = "../core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[features]
# Enabled by `dx serve --android` and `dx serve --ios`. There is no desktop feature.
mobile = ["dioxus/mobile"]
