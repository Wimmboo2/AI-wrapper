[application]
name = "Omni"
out_dir = "dist"

[bundle]
identifier = "dev.wimmboo.omni"
publisher = "Omni"
icon = ["assets/icon.png"]
short_description = "Multi-provider AI chat"
long_description = "Omni Chat for Android and iOS. Talks to your existing Omni Cloudflare Worker."

[android]
min_sdk = 24

[android.application]
uses_cleartext_traffic = true

[android.permissions]
"android.permission.INTERNET" = { description = "Send chat requests to your Omni API endpoint." }

[ios]
deployment_target = "15.0"
